[workspace]
members = ["crates/netscope-packet", "crates/netscope-policy", "crates/netscope-conntrack"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/samilerol/rust-firewall"

[workspace.lints.rust]
unsafe_code = "forbid"
