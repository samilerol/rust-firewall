# Isolated Rust-native UI spike. Own workspace so the core keeps MSRV 1.85 and almost no
# dependencies; see docs/UI_SPIKE.md. Not wired to the APK yet.
[package]
name = "netscope-ui"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

# The UI is outside the core's unsafe-forbid boundary but denies unsafe by default; the single
# Android entry symbol carries a function-local exception, like the JNI exports.
[lints.rust]
unsafe_code = "deny"

[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["glow"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["glow", "android-native-activity"] }
android-activity = { version = "=0.6.1", features = ["native-activity"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["glow", "x11"] }

[[bin]]
name = "netscope-ui-desktop"
path = "src/main.rs"
