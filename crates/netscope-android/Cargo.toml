[package]
name = "netscope-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# JNI symbol export is an isolated exception to the core's unsafe-forbid policy.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
jni = { version = "=0.21.1", default-features = false }
netscope-packet = { path = "../netscope-packet" }
netscope-policy = { path = "../netscope-policy" }
netscope-transport = { path = "../netscope-transport" }
socket2 = "=0.6.5"
