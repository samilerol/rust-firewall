name: Rust dependency policy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable install cargo-deny --version 0.21.0 --locked
      - name: RustSec advisories, licenses and sources for runtime workspace
        run: cargo +stable deny --locked check advisories licenses sources
      - name: RustSec advisories, licenses and sources for isolated fuzz tools
        run: cargo +stable deny --manifest-path fuzz/Cargo.toml --locked --config deny.toml check advisories licenses sources
  android-targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target aarch64-linux-android,x86_64-linux-android
      - run: cargo +stable check --locked -p netscope-transport --target aarch64-linux-android --target x86_64-linux-android
