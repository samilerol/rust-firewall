name: Android diagnostic build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Toolchains and observed resources
        run: |
          java -version
          javac -version
          nproc
          free -h
          rustup toolchain install stable --profile minimal --target aarch64-linux-android,x86_64-linux-android
      - name: Verify diagnostic VPN safety invariants
        run: python3 tools/check_android_diagnostic.py
      - name: Host JVM protected UDP boundary checks
        run: |
          mkdir -p /tmp/netscope-udp
          javac --release 17 -d /tmp/netscope-udp android/app/src/main/java/org/netscope/ngfw/ProtectedUdpSocketFactory.java tools/ProtectedUdpSocketSmoke.java
          java -cp /tmp/netscope-udp ProtectedUdpSocketSmoke
      - name: TUN egress host-JVM framing and fail-stop checks
        run: |
          mkdir -p /tmp/netscope-tun-egress
          javac --release 17 -d /tmp/netscope-tun-egress android/app/src/main/java/org/netscope/ngfw/TunPacketWriter.java tools/TunPacketWriterSmoke.java
          java -cp /tmp/netscope-tun-egress org.netscope.ngfw.TunPacketWriterSmoke
      - name: Bounded TUN egress queue host-JVM contract
        run: |
          mkdir -p /tmp/netscope-tun-queue
          javac --release 17 -d /tmp/netscope-tun-queue android/app/src/main/java/org/netscope/ngfw/TunPacketWriter.java android/app/src/main/java/org/netscope/ngfw/TunEgressQueue.java tools/TunEgressQueueSmoke.java
          java -cp /tmp/netscope-tun-queue org.netscope.ngfw.TunEgressQueueSmoke
      - name: Synthetic Rust to bounded Java TUN queue JNI smoke
        run: |
          cargo +stable build --locked -p netscope-android
          mkdir -p /tmp/netscope-egress-jni
          javac --release 17 -d /tmp/netscope-egress-jni android/app/src/main/java/org/netscope/ngfw/NativeCore.java android/app/src/main/java/org/netscope/ngfw/TunPacketWriter.java android/app/src/main/java/org/netscope/ngfw/TunEgressQueue.java tools/TunEgressJniSmoke.java
          java -Xcheck:jni -Djava.library.path=target/debug -cp /tmp/netscope-egress-jni org.netscope.ngfw.TunEgressJniSmoke
      - name: Native UDP relay to JNI TUN queue loopback contract
        run: |
          cargo +stable build --locked -p netscope-android
          mkdir -p /tmp/netscope-relay-jni
          javac --release 17 -d /tmp/netscope-relay-jni android/app/src/main/java/org/netscope/ngfw/NativeCore.java android/app/src/main/java/org/netscope/ngfw/TunPacketWriter.java android/app/src/main/java/org/netscope/ngfw/TunEgressQueue.java tools/UdpRelayJniSmoke.java
          java -Xcheck:jni -Djava.library.path=target/debug -cp /tmp/netscope-relay-jni org.netscope.ngfw.UdpRelayJniSmoke
      - name: Real JVM JNI boundary checks
        run: |
          cargo +stable build --locked -p netscope-android
          mkdir -p /tmp/netscope-jni
          javac --release 17 -d /tmp/netscope-jni android/app/src/main/java/org/netscope/ngfw/NativeCore.java tools/JniSmoke.java
          java -Xcheck:jni -Djava.library.path=target/debug -cp /tmp/netscope-jni JniSmoke crates/netscope-packet/tests/fixtures/v4-tcp-odd.hex
      - name: Rust-owned sockets JNI protection contract
        run: |
          cargo +stable build --locked -p netscope-android
          mkdir -p /tmp/netscope-native-protect
          javac --release 17 -d /tmp/netscope-native-protect android/app/src/main/java/org/netscope/ngfw/NativeCore.java tools/NativeSocketProtectionSmoke.java
          java -Xcheck:jni -Djava.library.path=target/debug -cp /tmp/netscope-native-protect NativeSocketProtectionSmoke
      - name: Dormant UDP session JNI lifecycle contract
        run: |
          cargo +stable build --locked -p netscope-android
          mkdir -p /tmp/netscope-session-jni
          javac --release 17 -d /tmp/netscope-session-jni android/app/src/main/java/org/netscope/ngfw/NativeCore.java tools/UdpSessionLifecycleSmoke.java
          java -Xcheck:jni -Djava.library.path=target/debug -cp /tmp/netscope-session-jni UdpSessionLifecycleSmoke
      - name: Install Android build components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"'
      - name: Build Rust JNI for both ABIs
        env:
          RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
        run: |
          ndk_bin="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ndk_bin/aarch64-linux-android26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$ndk_bin/x86_64-linux-android26-clang"
          cargo +stable build --release --locked -p netscope-android --target aarch64-linux-android --target x86_64-linux-android
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/x86_64
          cp target/aarch64-linux-android/release/libnetscope_android.so android/app/src/main/jniLibs/arm64-v8a/
          cp target/x86_64-linux-android/release/libnetscope_android.so android/app/src/main/jniLibs/x86_64/
      - name: Assert test-only JNI exports absent from Android native libraries
        run: |
          nm="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for abi in arm64-v8a x86_64; do
            lib="android/app/src/main/jniLibs/$abi/libnetscope_android.so"
            "$nm" --dynamic --defined-only "$lib" > "/tmp/netscope-$abi-symbols"
            grep -q 'Java_org_netscope_ngfw_NativeCore_inspect' "/tmp/netscope-$abi-symbols"
            grep -q 'Java_org_netscope_ngfw_NativeCore_startUdpSession' "/tmp/netscope-$abi-symbols"
            grep -q 'Java_org_netscope_ngfw_NativeCore_stopUdpSession' "/tmp/netscope-$abi-symbols"
            grep -q 'Java_org_netscope_ngfw_NativeCore_resetUdpSessionNetwork' "/tmp/netscope-$abi-symbols"
            if grep -E 'Java_org_netscope_ngfw_NativeCore_(probeProtectedSockets|probeProtectedSocketsOnWorker|probeUdpRelayLoopback|probeTunEgressQueue)' "/tmp/netscope-$abi-symbols"; then
              echo "Host test JNI symbol leaked into Android $abi"
              exit 1
            fi
          done
      - name: Build and lint diagnostic APK
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:lintDebug
      - name: Check packaged native libraries
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('android/app/build/outputs/apk/debug/app-debug.apk') as apk:
              for abi in ['arm64-v8a', 'x86_64']:
                  assert 'lib/' + abi + '/libnetscope_android.so' in apk.namelist()
          PY
      - name: Preserve APK and lint evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: android-diagnostic
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
